<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentTrack-Parex | Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .plain-icon {
        width: 20px;
        height: 20px;
        display: inline-grid;
        place-items: center;
        font-weight: 900;
      }

      .standalone-note {
        border: 1px solid #ffd2b8;
        background: #fff0e7;
        color: #172154;
        border-radius: 8px;
        padding: 12px 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-mark" aria-hidden="true"><img src="talenttrack-parex-logo.png" alt=""></div>
          <div>
            <h1>TalentTrack-Parex</h1>
            <span>Gestão de talentos</span>
          </div>
        </div>
        <nav class="nav-list">
          <button id="nav-dashboard" class="active" type="button"><span class="plain-icon">▦</span> Dashboard</button>
          <button id="nav-employees" type="button"><span class="plain-icon">●</span> Colaboradores</button>
        </nav>
        <div class="sidebar-footer">
          <div class="admin-avatar">AD</div>
          <div>
            <b>Admin Parex</b>
            <span>Mapa de competências</span>
          </div>
        </div>
      </aside>

      <main id="app" class="main-content"></main>
    </div>

    <script>
      let employees = JSON.parse(localStorage.getItem('talenttrack-parex-employees') || 'null') || [
        {
          id: 1,
          name: 'Ana Silva',
          role: 'Desenvolvedora Front-end',
          department: 'Tecnologia',
          avatar: 'https://i.pravatar.cc/150?u=ana',
          skills: [
            { name: 'React', level: 5, type: 'hard' },
            { name: 'JavaScript', level: 5, type: 'hard' },
            { name: 'UI/UX', level: 3, type: 'hard' },
            { name: 'Comunicacao', level: 4, type: 'soft' },
            { name: 'Lideranca', level: 2, type: 'soft' },
            { name: 'Resolucao de Problemas', level: 5, type: 'soft' }
          ]
        },
        {
          id: 2,
          name: 'Carlos Mendes',
          role: 'Analista de Marketing',
          department: 'Marketing',
          avatar: 'https://i.pravatar.cc/150?u=carlos',
          skills: [
            { name: 'SEO', level: 4, type: 'hard' },
            { name: 'Copywriting', level: 5, type: 'hard' },
            { name: 'Analise de Dados', level: 2, type: 'hard' },
            { name: 'Trabalho em Equipe', level: 5, type: 'soft' },
            { name: 'Gestao de Tempo', level: 3, type: 'soft' }
          ]
        },
        {
          id: 3,
          name: 'Mariana Costa',
          role: 'Gerente de Projetos',
          department: 'Operacoes',
          avatar: 'https://i.pravatar.cc/150?u=mariana',
          skills: [
            { name: 'Scrum/Agile', level: 5, type: 'hard' },
            { name: 'Gestao de Orcamento', level: 4, type: 'hard' },
            { name: 'Lideranca', level: 5, type: 'soft' },
            { name: 'Negociacao', level: 4, type: 'soft' },
            { name: 'Ingles', level: 3, type: 'hard' },
            { name: 'Pensamento Analitico', level: 3, type: 'soft' }
          ]
        },
        {
          id: 4,
          name: 'Rafael Souza',
          role: 'Designer Grafico',
          department: 'Marketing',
          avatar: 'https://i.pravatar.cc/150?u=rafael',
          skills: [
            { name: 'Photoshop', level: 5, type: 'hard' },
            { name: 'Figma', level: 4, type: 'hard' },
            { name: 'Criatividade', level: 5, type: 'soft' },
            { name: 'Atencao aos Detalhes', level: 2, type: 'soft' },
            { name: 'Comunicacao', level: 3, type: 'soft' }
          ]
        },
        {
          id: 5,
          name: 'Bianca Rocha',
          role: 'Analista de RH',
          department: 'Pessoas',
          avatar: 'https://i.pravatar.cc/150?u=bianca',
          skills: [
            { name: 'People Analytics', level: 4, type: 'hard' },
            { name: 'Recrutamento', level: 5, type: 'hard' },
            { name: 'Comunicacao', level: 5, type: 'soft' },
            { name: 'Lideranca', level: 3, type: 'soft' },
            { name: 'Negociacao', level: 4, type: 'soft' }
          ]
        }
      ];
      let currentEditId = null;
      let collectiveActions = JSON.parse(localStorage.getItem('talenttrack-parex-actions') || '[]');

      const sectorOptions = ['Tecnologia', 'Marketing', 'Operações', 'Pessoas', 'Comercial', 'Financeiro', 'Planejamento', 'Produção', 'Logística', 'Atendimento'];
      const roleOptions = ['Assistente', 'Analista Junior', 'Analista Pleno', 'Analista Senior', 'Especialista', 'Designer', 'Desenvolvedor(a)', 'Coordenador(a)', 'Gerente', 'Tech Lead'];
      const tenureOptions = ['Menos de 6 meses', '6 meses a 1 ano', '1 a 2 anos', '2 a 5 anos', 'Mais de 5 anos'];
      const courseOptions = ['Excel Avançado', 'Power BI', 'Gestão de Projetos', 'Liderança', 'Comunicação', 'Análise de Dados', 'Scrum/Agile', 'Atendimento ao Cliente', 'Segurança do Trabalho', 'Inglês'];
      const certificateOptions = ['Scrum Foundation', 'Power BI', 'Excel', 'Google Analytics', 'AWS Cloud', 'NR-10', 'NR-35', 'LGPD', 'Lean Six Sigma', 'Gestão de Pessoas'];
      const profileOptions = ['Analítico', 'Comunicador', 'Criativo', 'Executor', 'Líder', 'Técnico especialista', 'Planejador', 'Generalista'];
      const leadershipOptions = ['Baixo', 'Em desenvolvimento', 'Alto', 'Pronto para liderar'];
      const performanceOptions = ['Abaixo do esperado', 'Adequado', 'Acima do esperado', 'Destaque'];
      const evaluationOptions = ['Questionário concluído', 'Autoavaliação concluída', 'Avaliação do gestor concluída', 'Teste prático concluído', 'Indicadores de desempenho atualizados'];
      const statusOptions = ['Ativo', 'Em treinamento', 'Em transição interna', 'Afastado'];

      const accentMap = {
        'Comunicacao': 'Comunicação',
        'Lideranca': 'Liderança',
        'Gestao de Tempo': 'Gestão de Tempo',
        'Gestao de Orcamento': 'Gestão de Orçamento',
        'Analise de Dados': 'Análise de Dados',
        'Resolucao de Problemas': 'Resolução de Problemas',
        'Atencao aos Detalhes': 'Atenção aos Detalhes',
        'Operacoes': 'Operações',
        'Producao': 'Produção',
        'Logistica': 'Logística',
        'Ingles': 'Inglês',
        'Excel Avancado': 'Excel Avançado',
        'Seguranca do Trabalho': 'Segurança do Trabalho',
        'Questionario concluido': 'Questionário concluído',
        'Autoavaliacao concluida': 'Autoavaliação concluída',
        'Avaliacao do gestor concluida': 'Avaliação do gestor concluída',
        'Teste pratico concluido': 'Teste prático concluído',
        'Analitico': 'Analítico',
        'Tecnico especialista': 'Técnico especialista',
        'Designer Grafico': 'Designer Gráfico'
      };

      function text(value) {
        return accentMap[value] || value || '';
      }

      function normalizeEmployee(employee) {
        return {
          tenure: '1 a 2 anos',
          courses: [],
          experiences: '',
          certificates: [],
          evaluations: [],
          professionalProfile: 'Analítico',
          leadershipPotential: 'Em desenvolvimento',
          performance: 'Adequado',
          idealArea: employee.department || 'Planejamento',
          entryDate: '2024-01-15',
          email: '',
          manager: 'Gestor Parex',
          status: 'Ativo',
          ...employee,
          role: text(employee.role),
          department: text(employee.department),
          idealArea: text(employee.idealArea || employee.department || 'Planejamento'),
          professionalProfile: text(employee.professionalProfile || 'Analítico'),
          courses: (employee.courses || []).map(text),
          certificates: (employee.certificates || []).map(text),
          evaluations: (employee.evaluations || []).map(text),
          entryDate: employee.entryDate || '2024-01-15',
          email: employee.email || `${(employee.name || 'colaborador').toLowerCase().replace(/\s+/g, '.')}@parex.com.br`,
          manager: employee.manager || 'Gestor Parex',
          status: employee.status || 'Ativo',
          skills: (employee.skills || []).map((skill) => ({ ...skill, name: text(skill.name) }))
        };
      }

      employees = employees.map(normalizeEmployee);
      saveEmployees();

      function saveEmployees() {
        localStorage.setItem('talenttrack-parex-employees', JSON.stringify(employees));
      }

      function saveCollectiveActions() {
        localStorage.setItem('talenttrack-parex-actions', JSON.stringify(collectiveActions));
      }

      const app = document.querySelector('#app');
      const navDashboard = document.querySelector('#nav-dashboard');
      const navEmployees = document.querySelector('#nav-employees');

      function clamp(level) {
        return Math.min(5, Math.max(1, Number(level) || 1));
      }

      function optionTags(options, selected) {
        return options.map((option) => `<option value="${option}" ${option === selected ? 'selected' : ''}>${option}</option>`).join('');
      }

      function checkboxGroup(name, options, selectedItems) {
        const selected = selectedItems || [];
        return options.map((option) => `
          <label class="check-option">
            <input type="checkbox" name="${name}" value="${option}" ${selected.includes(option) ? 'checked' : ''}>
            <span>${option}</span>
          </label>
        `).join('');
      }

      function checkedValues(name) {
        return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((item) => item.value);
      }

      function formatDateBR(value) {
        if (!value) return 'Não informado';
        const [year, month, day] = value.split('-');
        return `${day}/${month}/${year}`;
      }

      function metricStatus(label, value, status, description) {
        return `
          <article class="metric-card status-${status}">
            <div class="metric-status">
              <span class="status-dot"></span>
              <b>${status === 'good' ? 'Bom' : status === 'mid' ? 'Médio' : 'Ruim'}</b>
            </div>
            <span>${label}</span>
            <strong>${value}</strong>
            <small>${description}</small>
          </article>
        `;
      }

      function registerCollectiveAction(title, previousEmployees) {
        collectiveActions.unshift({
          id: Date.now(),
          title,
          date: new Date().toLocaleString('pt-BR'),
          previousEmployees
        });
        collectiveActions = collectiveActions.slice(0, 6);
        saveCollectiveActions();
      }

      function undoCollectiveAction(id) {
        const action = collectiveActions.find((item) => item.id === id);
        if (!action) return;
        if (!confirm(`Desfazer a ação coletiva "${action.title}"?`)) return;
        employees = action.previousEmployees.map(normalizeEmployee);
        collectiveActions = collectiveActions.filter((item) => item.id !== id);
        saveEmployees();
        saveCollectiveActions();
        renderEmployees();
      }

      function removeCollectiveAction(id) {
        collectiveActions = collectiveActions.filter((item) => item.id !== id);
        saveCollectiveActions();
        renderEmployees();
      }

      function insight() {
        const map = new Map();
        let strong = 0;
        let medium = 0;
        let weak = 0;
        employees.forEach((employee) => {
          employee.skills.forEach((skill) => {
            const current = map.get(skill.name) || { name: skill.name, total: 0, count: 0 };
            current.total += clamp(skill.level);
            current.count += 1;
            map.set(skill.name, current);
            if (skill.level >= 4) strong += 1;
            else if (skill.level === 3) medium += 1;
            else weak += 1;
          });
        });
        const ranking = [...map.values()]
          .map((skill) => ({ ...skill, average: Number((skill.total / skill.count).toFixed(1)) }))
          .sort((a, b) => b.average - a.average);
        const total = strong + medium + weak;
        const leaders = employees.filter((employee) =>
          employee.skills.some((skill) => text(skill.name) === 'Liderança' && skill.level >= 4)
        ).length;
        return {
          ranking,
          strong,
          medium,
          weak,
          total,
          leaders,
          strongPct: total ? Math.round((strong / total) * 100) : 0,
          mediumPct: total ? Math.round((medium / total) * 100) : 0,
          weakPct: total ? Math.round((weak / total) * 100) : 0
        };
      }

      function setActive(view) {
        navDashboard.classList.toggle('active', view === 'dashboard');
        navEmployees.classList.toggle('active', view === 'employees');
      }

      function skillChart(items) {
        return `
          <div class="skill-chart" onmouseenter="playSkillChart(this)">
            ${items.slice(0, 10).map((skill) => {
              const height = 22 + (skill.average / 5) * 78;
              const tone = skill.average >= 4 ? 'good' : skill.average >= 3 ? 'mid' : 'bad';
              return `
                <div class="skill-column ${tone}">
                  <div class="skill-column__bar" style="height:${height}%; --delay:${items.indexOf(skill) * 55}ms"><b>${skill.average.toFixed(1)}</b></div>
                  <span>${skill.name}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function riskList(items) {
        return `
          <div class="risk-list">
            ${items.map((skill) => `
              <div class="risk-pill ${skill.average >= 4 ? 'good' : skill.average >= 3 ? 'mid' : 'bad'}">
                <span>${skill.name}</span>
                <b>${skill.average.toFixed(1)}/5</b>
              </div>
            `).join('')}
          </div>
        `;
      }

      function playSkillChart(chart) {
        if (chart.classList.contains('has-played')) return;
        chart.classList.add('is-generating');
        chart.classList.add('has-played');
        setTimeout(() => chart.classList.remove('is-generating'), 1100);
      }

      function renderDashboard() {
        setActive('dashboard');
        const data = insight();
        const donut = `conic-gradient(var(--success) 0 ${data.strongPct}%, var(--warning) ${data.strongPct}% ${data.strongPct + data.mediumPct}%, var(--danger) ${data.strongPct + data.mediumPct}% 100%)`;
        const alerts = data.ranking.filter((skill) => skill.average < 2.8);
        const averageSkill = data.total ? ((data.strong * 5 + data.medium * 3 + data.weak * 1.5) / data.total) : 0;
        const talentStatus = data.strongPct >= 50 ? 'good' : data.strongPct >= 30 ? 'mid' : 'bad';
        const leaderRate = employees.length ? Math.round((data.leaders / employees.length) * 100) : 0;
        const leaderStatus = leaderRate >= 30 ? 'good' : leaderRate >= 15 ? 'mid' : 'bad';
        const coverageStatus = data.total / Math.max(employees.length, 1) >= 6 ? 'good' : data.total / Math.max(employees.length, 1) >= 4 ? 'mid' : 'bad';

        app.innerHTML = `
          <section class="view-stack">
            <div class="hero-panel">
              <div>
                <span class="eyebrow"><span class="plain-icon">✦</span> Inteligência de talentos</span>
                <h2>Mapeie competências, encontre potencial e decida melhor.</h2>
                <p>A TalentTrack-Parex organiza habilidades técnicas e comportamentais para indicar melhores funções, treinamentos necessários e oportunidades reais de crescimento.</p>
              </div>
              <div class="hero-score">
                <span>Saúde geral</span>
                <strong>${data.strongPct}%</strong>
                <small>competências fortes</small>
              </div>
            </div>

            <div class="metric-grid">
              ${metricStatus('Colaboradores', employees.length, employees.length >= 5 ? 'good' : employees.length >= 3 ? 'mid' : 'bad', employees.length >= 5 ? 'base suficiente' : 'cadastre mais perfis')}
              ${metricStatus('Competências mapeadas', data.total, coverageStatus, `${(data.total / Math.max(employees.length, 1)).toFixed(1)} por colaborador`)}
              ${metricStatus('Altos talentos', data.strong, talentStatus, `${data.strongPct}% das competências`)}
              ${metricStatus('Líderes prontos', data.leaders, leaderStatus, `${leaderRate}% da equipe`)}
            </div>

            <div class="dashboard-grid">
              <article class="panel compact-panel">
                <div class="panel-heading">
                  <div><h3>Saúde das competências</h3><p>Distribuição por nível de domínio</p></div>
                  <span class="plain-icon">▣</span>
                </div>
                <div class="donut-wrap">
                  <div class="donut" style="background:${donut}">
                    <div><strong>${data.total}</strong><span>total</span></div>
                  </div>
                </div>
                <div class="legend-row"><span><i class="success"></i>Fortalezas</span><b>${data.strongPct}%</b></div>
                <div class="legend-row"><span><i class="warning"></i>Adequadas</span><b>${data.mediumPct}%</b></div>
                <div class="legend-row"><span><i class="danger"></i>Carências</span><b>${data.weakPct}%</b></div>
              </article>

              <article class="panel alert-panel">
                <div class="panel-heading">
                  <div><h3>Alertas e recomendações</h3><p>Sinais gerados a partir das notas atuais</p></div>
                  <span class="plain-icon">!</span>
                </div>
                <div class="alert-list">
                  ${alerts.map((alert) => `
                    <div class="alert-item danger">
                      <span class="plain-icon">!</span>
                      <div><b>Gargalo em ${alert.name}</b><span>Média ${alert.average}/5. Recomenda-se treinamento para reduzir risco operacional.</span></div>
                    </div>
                  `).join('')}
                  <div class="alert-item warning">
                    <span class="plain-icon">!</span>
                    <div><b>Pipeline de liderança</b><span>Monitore colaboradores com potencial de gestão para criar plano de sucessão.</span></div>
                  </div>
                </div>
              </article>
            </div>

            <article class="panel">
              <div class="panel-heading">
                <div><h3>Desempenho por competência</h3><p>Médias por habilidade em gráfico comparativo</p></div>
                <span class="plain-icon">▤</span>
              </div>
              <div class="competency-board">
                ${skillChart(data.ranking)}
                <div>
                  <h4 class="danger">Pontos que precisam de atenção</h4>
                  ${riskList(data.ranking.slice(-6).reverse())}
                  <div class="chart-summary">
                    <b>Média estimada: ${averageSkill.toFixed(1)}/5</b>
                    <span>${averageSkill >= 3.8 ? 'Cenário saudável para crescimento interno.' : averageSkill >= 3 ? 'Cenário médio, com espaço para treinamentos direcionados.' : 'Cenário crítico, exige plano de capacitação.'}</span>
                  </div>
                </div>
              </div>
            </article>
          </section>
        `;
      }

      function skillBars(skills, type) {
        return skills.filter((skill) => skill.type === type).map((skill) => `
          <div class="skill-row">
            <div class="skill-row__top"><span>${skill.name}</span><b>${skill.level}/5</b></div>
            <div class="skill-blocks">
              ${[1, 2, 3, 4, 5].map((item) => `<span class="${item <= skill.level ? (skill.level >= 4 ? 'strong' : skill.level === 3 ? 'medium' : 'weak') : ''}"></span>`).join('')}
            </div>
          </div>
        `).join('');
      }

      function renderEmployees() {
        setActive('employees');
        app.innerHTML = `
          <section class="view-stack">
            <div class="toolbar">
              <div>
                <h2>Gestão de colaboradores</h2>
                <p>Adicione, edite ou remova perfis individualmente. Use a gestão coletiva para padronizar competências.</p>
              </div>
              <div class="toolbar-actions">
                <button class="button primary" type="button" onclick="openEmployeeModal()">+ Novo colaborador</button>
              </div>
            </div>
            <article class="panel management-panel">
              <div class="panel-heading">
                <div><h3>Ações coletivas</h3><p>Aplicam mudanças em todos os colaboradores cadastrados. Cada ação fica registrada e pode ser desfeita.</p></div>
                <span class="plain-icon">▦</span>
              </div>
              <div class="bulk-actions">
                <button class="button secondary" type="button" onclick="bulkAddSkill()">Adicionar competência coletiva</button>
                <button class="button secondary" type="button" onclick="bulkNormalizeLeadership()">Padronizar liderança mínima</button>
                <button class="button danger" type="button" onclick="bulkClearWeakSkills()">Remover competências críticas</button>
              </div>
              <div class="action-history">
                ${collectiveActions.length ? collectiveActions.map((action) => `
                  <div class="action-history__item">
                    <div><b>${action.title}</b><span>${action.date}</span></div>
                    <div class="row-actions">
                      <button class="mini-button" type="button" onclick="undoCollectiveAction(${action.id})">Desfazer</button>
                      <button class="mini-button danger" type="button" onclick="removeCollectiveAction(${action.id})">Apagar registro</button>
                    </div>
                  </div>
                `).join('') : '<p class="muted">Nenhuma ação coletiva aplicada ainda.</p>'}
              </div>
            </article>
            <div class="employee-grid">
              ${employees.map((employee) => {
                const avg = employee.skills.length ? employee.skills.reduce((sum, skill) => sum + skill.level, 0) / employee.skills.length : 0;
                return `
                  <article class="employee-card">
                    <div class="employee-card__top">
                      <img src="${employee.avatar}" alt="${employee.name}">
                      <div>
                        <h3>${employee.name}</h3>
                        <p>${employee.role}</p>
                        <span>${employee.department} - ${employee.professionalProfile}</span>
                        <span>Entrada: ${formatDateBR(employee.entryDate)}</span>
                      </div>
                    </div>
                    <div class="employee-card__stats"><span>${employee.status}</span><b>${avg.toFixed(1)} média</b></div>
                    <button class="profile-link" type="button" onclick="renderProfile(${employee.id})">Gerenciar perfil <span>›</span></button>
                  </article>
                `;
              }).join('')}
            </div>
            <article class="panel">
              <div class="panel-heading">
                <div><h3>Edição rápida coletiva</h3><p>Visão administrativa para editar ou excluir perfis.</p></div>
                <span class="plain-icon">▤</span>
              </div>
              <div class="table-wrap">
                <table class="people-table">
                  <thead>
                    <tr><th>Colaborador</th><th>Cargo</th><th>Setor</th><th>Entrada</th><th>Status</th><th>Ações</th></tr>
                  </thead>
                  <tbody>
                    ${employees.map((employee) => `
                      <tr>
                        <td><b>${employee.name}</b></td>
                        <td>${employee.role}</td>
                        <td>${employee.department}</td>
                        <td>${formatDateBR(employee.entryDate)}</td>
                        <td>${employee.status}</td>
                        <td>
                          <div class="row-actions">
                            <button class="mini-button" type="button" onclick="openEmployeeModal(${employee.id})">Editar</button>
                            <button class="mini-button" type="button" onclick="renderProfile(${employee.id})">Perfil</button>
                            <button class="mini-button danger" type="button" onclick="deleteEmployee(${employee.id})">Excluir</button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </article>
          </section>
        `;
      }

      function renderProfile(id) {
        setActive('employees');
        const employee = employees.find((item) => item.id === id);
        const strengths = employee.skills.filter((skill) => skill.level >= 4);
        const weaknesses = employee.skills.filter((skill) => skill.level <= 2);
        app.innerHTML = `
          <section class="view-stack profile-view">
            <button class="back-button" type="button" onclick="renderEmployees()">‹ Voltar para colaboradores</button>
            <article class="profile-header">
              <img src="${employee.avatar}" alt="${employee.name}">
              <div class="profile-title">
                <h2>${employee.name}</h2>
                <p>${employee.role}</p>
                <span>${employee.department} - entrada em ${formatDateBR(employee.entryDate)}</span>
              </div>
              <div class="profile-actions">
                <button class="button primary" type="button" onclick="openEmployeeModal(${employee.id})">Editar perfil</button>
                <button class="button danger" type="button" onclick="deleteEmployee(${employee.id})">Excluir</button>
              </div>
            </article>
            <div class="profile-grid">
              <div class="view-stack">
                <article class="panel">
                  <div class="panel-heading"><div><h3>Hard skills</h3><p>Competências técnicas do cargo</p></div><span class="plain-icon">▧</span></div>
                  <div class="skills-list">${skillBars(employee.skills, 'hard')}</div>
                </article>
                <article class="panel">
                  <div class="panel-heading"><div><h3>Soft skills</h3><p>Comportamentos e colaboração</p></div><span class="plain-icon">●</span></div>
                  <div class="skills-list">${skillBars(employee.skills, 'soft')}</div>
                </article>
              </div>
              <aside class="analysis-column">
                <article class="panel tag-panel">
                  <div class="panel-heading"><div><h3>Dados de RH</h3></div><span class="plain-icon">▤</span></div>
                  <div class="detail-grid">
                    <span><b>Perfil</b>${employee.professionalProfile}</span>
                    <span><b>Área ideal</b>${employee.idealArea}</span>
                    <span><b>Lideranca</b>${employee.leadershipPotential}</span>
                    <span><b>Desempenho</b>${employee.performance}</span>
                  </div>
                </article>
                <article class="panel analysis-panel brand">
                  <div class="panel-heading"><div><h3>Sugestão inteligente</h3></div><span class="plain-icon">✦</span></div>
                  <ul><li>${employee.professionalProfile} com desempenho ${employee.performance.toLowerCase()}. Recomendação: atuar em ${employee.idealArea} e seguir trilha de ${employee.leadershipPotential.toLowerCase()}.</li></ul>
                </article>
                <article class="panel analysis-panel success">
                  <div class="panel-heading"><div><h3>Trilhas recomendadas</h3></div><span class="plain-icon">▤</span></div>
                  <ul>${weaknesses.length ? weaknesses.map((skill) => `<li>Curso de nivelamento em ${skill.name}</li>`).join('') : '<li>Nenhum treinamento urgente detectado.</li>'}${employee.courses.map((course) => `<li>Curso cadastrado: ${course}</li>`).join('')}</ul>
                </article>
                <article class="panel tag-panel">
                  <div class="panel-heading"><div><h3>Avaliações e certificados</h3></div><span class="plain-icon">✓</span></div>
                  <div class="tag-list">${employee.evaluations.map((item) => `<span class="success">${item}</span>`).join('') || '<p class="muted">Nenhuma avaliação registrada.</p>'}</div>
                  <div class="tag-list spaced-tags">${employee.certificates.map((item) => `<span class="warning">${item}</span>`).join('') || '<p class="muted">Nenhum certificado cadastrado.</p>'}</div>
                </article>
                <article class="panel tag-panel">
                  <div class="panel-heading"><div><h3>Maiores forças</h3></div><span class="plain-icon">★</span></div>
                  <div class="tag-list">${strengths.map((skill) => `<span class="warning">${skill.name}</span>`).join('') || '<p class="muted">Nenhum ponto forte identificado.</p>'}</div>
                </article>
                <article class="panel tag-panel">
                  <div class="panel-heading"><div><h3>Pontos de atenção</h3></div><span class="plain-icon">!</span></div>
                  <div class="tag-list">${weaknesses.map((skill) => `<span class="danger">${skill.name}</span>`).join('') || '<p class="muted">Sem pontos críticos.</p>'}</div>
                </article>
              </aside>
            </div>
          </section>
        `;
      }

      function openEmployeeModal(id) {
        currentEditId = id || null;
        const employee = id ? employees.find((item) => item.id === id) : {
          name: '',
          role: '',
          department: '',
          tenure: 'Menos de 6 meses',
          courses: [],
          experiences: '',
          certificates: [],
          evaluations: [],
          professionalProfile: 'Analitico',
          leadershipPotential: 'Em desenvolvimento',
          performance: 'Adequado',
          idealArea: 'Planejamento',
          entryDate: new Date().toISOString().slice(0, 10),
          email: '',
          manager: 'Gestor Parex',
          status: 'Ativo',
          avatar: '',
          skills: []
        };
        document.body.insertAdjacentHTML('beforeend', `
          <div class="modal-backdrop" id="employee-modal">
            <form class="modal" onsubmit="saveEmployeeModal(event)">
              <h3>${id ? 'Editar colaborador' : 'Novo colaborador'}</h3>
              <p>Atualize dados do perfil e competências individuais.</p>
              <div class="modal-grid">
                <label class="field"><span>Nome</span><input id="emp-name" required value="${employee.name}"></label>
                <label class="field"><span>Data de entrada</span><input id="emp-entry-date" type="date" required value="${employee.entryDate}"></label>
                <label class="field"><span>E-mail corporativo</span><input id="emp-email" type="email" value="${employee.email}" placeholder="nome@parex.com.br"></label>
                <label class="field"><span>Gestor responsável</span><input id="emp-manager" value="${employee.manager}" placeholder="Nome do gestor"></label>
                <label class="field"><span>Status</span><select id="emp-status">${optionTags(statusOptions, employee.status)}</select></label>
                <label class="field"><span>Cargo atual</span><select id="emp-role">${optionTags(roleOptions, employee.role)}</select></label>
                <label class="field"><span>Setor</span><select id="emp-department">${optionTags(sectorOptions, employee.department)}</select></label>
                <label class="field"><span>Tempo de empresa</span><select id="emp-tenure">${optionTags(tenureOptions, employee.tenure)}</select></label>
                <label class="field"><span>Perfil profissional</span><select id="emp-profile">${optionTags(profileOptions, employee.professionalProfile)}</select></label>
                <label class="field"><span>Potencial de liderança</span><select id="emp-leadership">${optionTags(leadershipOptions, employee.leadershipPotential)}</select></label>
                <label class="field"><span>Desempenho</span><select id="emp-performance">${optionTags(performanceOptions, employee.performance)}</select></label>
                <label class="field"><span>Área ideal sugerida</span><select id="emp-ideal-area">${optionTags(sectorOptions, employee.idealArea)}</select></label>
                <label class="field"><span>Foto do colaborador</span><input id="emp-avatar-file" type="file" accept="image/*" onchange="previewEmployeePhoto(event)"></label>
              </div>
              <div class="photo-preview">
                <img id="emp-avatar-preview" src="${employee.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(employee.name || 'Novo colaborador')}&background=263a8b&color=fff`}" alt="Prévia da foto">
                <span>Envie uma imagem do computador. Se não enviar, o sistema cria um avatar automático.</span>
              </div>
              <label class="field full-field"><span>Experiências anteriores</span><textarea id="emp-experiences" rows="3" placeholder="Ex: atendimento, gestão de equipe, projetos internos">${employee.experiences || ''}</textarea></label>
              <div class="preset-section">
                <h4>Cursos</h4>
                <div class="checkbox-grid">${checkboxGroup('emp-courses', courseOptions, employee.courses)}</div>
              </div>
              <div class="preset-section">
                <h4>Certificados</h4>
                <div class="checkbox-grid">${checkboxGroup('emp-certificates', certificateOptions, employee.certificates)}</div>
              </div>
              <div class="preset-section">
                <h4>Testes e avaliacoes</h4>
                <div class="checkbox-grid">${checkboxGroup('emp-evaluations', evaluationOptions, employee.evaluations)}</div>
              </div>
              <div class="skill-editor-list" id="skill-editor-list">
                ${employee.skills.map((skill, index) => skillEditorRow(skill, index)).join('')}
              </div>
              <button class="button secondary" type="button" onclick="addSkillEditorRow()">+ Adicionar competência</button>
              <div class="modal-actions">
                <button class="button secondary" type="button" onclick="closeEmployeeModal()">Cancelar</button>
                <button class="button success" type="submit">Salvar perfil</button>
              </div>
            </form>
          </div>
        `);
      }

      function skillEditorRow(skill, index) {
        return `
          <div class="skill-editor-row" data-skill-row>
            <label class="field"><span>Competência</span><input data-skill-name required value="${skill.name || ''}"></label>
            <label class="field"><span>Tipo</span><select data-skill-type><option value="hard" ${skill.type === 'hard' ? 'selected' : ''}>Técnica</option><option value="soft" ${skill.type === 'soft' ? 'selected' : ''}>Comportamental</option></select></label>
            <label class="field"><span>Nível</span><input data-skill-level type="number" min="1" max="5" value="${skill.level || 3}"></label>
            <button class="mini-button danger" type="button" onclick="this.closest('[data-skill-row]').remove()">Remover</button>
          </div>
        `;
      }

      function addSkillEditorRow() {
        document.querySelector('#skill-editor-list').insertAdjacentHTML('beforeend', skillEditorRow({ name: '', type: 'hard', level: 3 }));
      }

      function closeEmployeeModal() {
        document.querySelector('#employee-modal')?.remove();
      }

      function previewEmployeePhoto(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          document.querySelector('#emp-avatar-preview').src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      function readUploadedPhoto() {
        const input = document.querySelector('#emp-avatar-file');
        const file = input && input.files && input.files[0];
        if (!file) return Promise.resolve('');
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      }

      async function saveEmployeeModal(event) {
        event.preventDefault();
        const name = document.querySelector('#emp-name').value.trim();
        const entryDate = document.querySelector('#emp-entry-date').value;
        const email = document.querySelector('#emp-email').value.trim() || `${name.toLowerCase().replace(/\s+/g, '.')}@parex.com.br`;
        const manager = document.querySelector('#emp-manager').value.trim() || 'Gestor Parex';
        const status = document.querySelector('#emp-status').value;
        const role = document.querySelector('#emp-role').value;
        const department = document.querySelector('#emp-department').value;
        const tenure = document.querySelector('#emp-tenure').value;
        const professionalProfile = document.querySelector('#emp-profile').value;
        const leadershipPotential = document.querySelector('#emp-leadership').value;
        const performance = document.querySelector('#emp-performance').value;
        const idealArea = document.querySelector('#emp-ideal-area').value;
        const experiences = document.querySelector('#emp-experiences').value.trim();
        const courses = checkedValues('emp-courses');
        const certificates = checkedValues('emp-certificates');
        const evaluations = checkedValues('emp-evaluations');
        const uploadedAvatar = await readUploadedPhoto();
        const existingAvatar = currentEditId ? (employees.find((employee) => employee.id === currentEditId)?.avatar || '') : '';
        const avatar = uploadedAvatar || existingAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=263a8b&color=fff`;
        const skills = [...document.querySelectorAll('[data-skill-row]')].map((row) => ({
          name: row.querySelector('[data-skill-name]').value.trim(),
          type: row.querySelector('[data-skill-type]').value,
          level: clamp(row.querySelector('[data-skill-level]').value)
        })).filter((skill) => skill.name);

        if (currentEditId) {
          employees = employees.map((employee) => employee.id === currentEditId ? { ...employee, name, entryDate, email, manager, status, role, department, tenure, professionalProfile, leadershipPotential, performance, idealArea, experiences, courses, certificates, evaluations, avatar, skills } : employee);
        } else {
          employees.push({ id: Date.now(), name, entryDate, email, manager, status, role, department, tenure, professionalProfile, leadershipPotential, performance, idealArea, experiences, courses, certificates, evaluations, avatar, skills });
        }
        saveEmployees();
        closeEmployeeModal();
        renderEmployees();
      }

      function deleteEmployee(id) {
        const employee = employees.find((item) => item.id === id);
        if (!employee || !confirm(`Excluir o perfil de ${employee.name}?`)) return;
        employees = employees.filter((item) => item.id !== id);
        saveEmployees();
        renderEmployees();
      }

      function bulkAddSkill() {
        const name = prompt('Nome da competência para adicionar em todos:');
        if (!name) return;
        const level = clamp(prompt('Nível inicial de 1 a 5:', '3'));
        const previousEmployees = JSON.parse(JSON.stringify(employees));
        employees = employees.map((employee) => {
          if (employee.skills.some((skill) => skill.name.toLowerCase() === name.toLowerCase())) return employee;
          return { ...employee, skills: [...employee.skills, { name, type: 'hard', level }] };
        });
        registerCollectiveAction(`Competência "${name}" adicionada`, previousEmployees);
        saveEmployees();
        renderEmployees();
      }

      function bulkNormalizeLeadership() {
        const previousEmployees = JSON.parse(JSON.stringify(employees));
        employees = employees.map((employee) => {
          const hasLeadership = employee.skills.some((skill) => text(skill.name) === 'Liderança');
          if (hasLeadership) {
            return {
              ...employee,
              skills: employee.skills.map((skill) => text(skill.name) === 'Liderança' ? { ...skill, name: 'Liderança', level: Math.max(skill.level, 3) } : skill)
            };
          }
          return { ...employee, skills: [...employee.skills, { name: 'Liderança', type: 'soft', level: 3 }] };
        });
        registerCollectiveAction('Liderança mínima padronizada', previousEmployees);
        saveEmployees();
        renderEmployees();
      }

      function bulkClearWeakSkills() {
        if (!confirm('Remover de todos os perfis competências com nível 1 ou 2?')) return;
        const previousEmployees = JSON.parse(JSON.stringify(employees));
        employees = employees.map((employee) => ({ ...employee, skills: employee.skills.filter((skill) => skill.level > 2) }));
        registerCollectiveAction('Competências críticas removidas', previousEmployees);
        saveEmployees();
        renderEmployees();
      }

      navDashboard.addEventListener('click', renderDashboard);
      navEmployees.addEventListener('click', renderEmployees);
      renderDashboard();
    </script>
  </body>
</html>
